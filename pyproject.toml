[project]
name = "pinnslicer"
version = "0.1.0"
description = "PINN-Slicer: physics-informed neural network for black-hole photon orbits"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "scipy>=1.16.2",
    "torch>=2.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebooks = [
    "ipython>=8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pinnslicer*"]

[project.urls]
"Homepage" = "https://github.com/soot-bit/pinnslicer"